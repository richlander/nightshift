\* TLC config for Waiting.tla. Bounds are small on purpose: the interesting
\* interleavings here are short -- a window registers, a second joins, the server
\* restarts -- and adding windows multiplies states without reaching new shapes.

\* Every action is guarded on now < MaxTime, so the model has nothing left to do at the
\* bound. That is an artifact of bounding the clock, not a property of the tool, so
\* deadlock checking is off; the invariants below are what this run is for.
CHECK_DEADLOCK FALSE

SPECIFICATION Spec

CONSTANTS
    Windows = {1, 2, 3}
    PRs = {1, 2}
    MaxTime = 12

INVARIANTS
    TypeOK
    AtMostOneOwner
    NeverActOnUnwitnessedOrder
    NoCrossEpochMemory
    SoleClaimantIsAlwaysOwner
    NoOwnerWhileViewIncomplete

PROPERTIES
    NoPhantomDepartureStep
    RegistrationStableStep
    OwnerStableAcrossSweepStep
