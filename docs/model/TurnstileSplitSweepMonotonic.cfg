\* Contrast, not a counterexample: the same split sweep as TurnstileSplitSweep.cfg
\* with the clock forced to be monotone. This one passes, which is the point -- an
\* expired lease can never become live again, so a stale selection stays true.
\* Bounds are small on purpose: every defect this spec is aimed at shows up in a
\* handful of steps -- a lease expires while a client renews it, a commit races a
\* watcher's drain -- and adding keys or leases multiplies states without reaching
\* new shapes. Two of each is enough for one lease to be reaped while another is
\* renewed, and for one key to be swept while another survives.

\* Every action is guarded on a bound (now < MaxTime, rev < MaxRevision), so the model
\* has nothing left to do at the bound. That is an artifact of bounding the clock and
\* the log, not a property of the store, so deadlock checking is off.
CHECK_DEADLOCK FALSE

SPECIFICATION Spec

CONSTANTS
    Keys = {1, 2}
    Leases = {1, 2}
    Ttl = 1
    Skew = 1
    AllowClockStepBack = FALSE
    MaxTime = 3
    MaxRevision = 4
    Mutation = "SplitSweep"

INVARIANTS
    TypeOK
    LogIsGapless
    LiveKeysHaveALeaseRow
    NeverReapLiveLease
    NoWriteUnderExpiredLease
    NoLostWakeup
    BeliefMatchesStoredDeadline
    NeverReapBelievedLease

PROPERTIES
    RemovalIsLoggedStep
    RevisionNeverDecreasesStep
    CursorAdvancesSoundlyStep
